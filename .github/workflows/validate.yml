name: Validate configuration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate public source profiles
        run: |
          python scripts/manage.py lint --template
          python scripts/manage.py lint --template --profile tun
      - name: Check generated template is current
        run: |
          python scripts/build.py windows --template --output examples/windows-profile.template.json
          git diff --exit-code -- examples/windows-profile.template.json
